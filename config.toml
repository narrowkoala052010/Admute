# ============================================================
# AdMute v4 — Master Configuration
# All tunable parameters live here.
# Edit this file; run POST /api/config/reload to apply
# without restarting the daemon (except [audio] changes).
# ============================================================

[audio]
sample_rate       = 48000
chunk_size        = 2048
channels          = 2           # I2S INMP441 is stereo on Pi
device_name = "googlevoicehat"
silence_threshold = 0.001       # chunks below this RMS are discarded
buffer_seconds    = 1.0         # rolling capture window

[fingerprint]
nperseg           = 2048        # STFT window — matches chunk_size
noverlap_ratio    = 0.5         # 50% overlap
peak_percentile   = 88          # top N% of spectrogram energy
max_filter_size   = 20          # neighbourhood for maximum_filter
fan_value         = 15          # hash pairs per anchor peak
max_time_delta    = 200         # max frame gap between hash pairs

[match]
confidence_threshold = 25      # time-coherence score to declare a match
cooldown_seconds     = 35       # suppress re-match of same ad within window
strike_min           = 8       # minimum score worth logging as a strike
near_miss_ratio      = 0.75     # score >= this% of threshold = near miss

[mute]
backend                = "ir"   # "ir" | "cec"
safety_margin_seconds  = 1.5    # unmute this many seconds before ad ends
debounce_ms            = 250    # ignore duplicate match events within window
ir_remote_name         = "hisense"
ir_key_mute            = "KEY_MUTE"
cec_port               = 1      # HDMI port number for CEC (1-indexed)

[api]
port             = 5000
log_level        = "INFO"       # DEBUG | INFO | WARNING | ERROR

[paths]
db             = "admute.db"
recordings_dir = "recordings"
log_dir        = "logs"
